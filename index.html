<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />

    <!-- PWA。訓練会場の不安定な回線に備え、2回目以降は完全にオフラインで動く（SPEC §4.5） -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="STARTトリアージ" />
    <title>START法トリアージ・トレーナー | START Triage Trainer</title>
    <meta
      name="description"
      content="災害現場の一次トリアージ（START法）を反復練習するWebアプリ。Drill primary triage (START) for mass casualty incidents."
    />

    <!-- OGP: バックエンドを持たないため1種類のみ配信し、日英併記とする（docs/I18N.md §7） -->
    <meta property="og:type" content="website" />
    <!--
      正規URLはカスタムドメイン。pages.dev でも同じ内容が見えるため、
      canonical で正規化しておく（重複コンテンツの回避）。
    -->
    <link rel="canonical" href="https://start.keiku-labo.space/" />
    <meta property="og:url" content="https://start.keiku-labo.space/" />
    <meta property="og:title" content="START法トリアージ・トレーナー | START Triage Trainer" />
    <meta
      property="og:description"
      content="災害現場の一次トリアージ（START法）を反復練習する。10問チャレンジで全問正解を狙おう。&#10;Drill primary triage (START). Take the 10-case challenge and aim for a perfect score."
    />
    <meta property="og:image" content="https://start.keiku-labo.space/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="START法トリアージ・トレーナー。赤I・黄II・緑III・黒0のトリアージ区分と傷病者のイラスト。"
    />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:locale:alternate" content="en_US" />

    <!--
      X はこれらが無ければ og:* にフォールバックするが、明示しておく方が確実。
      summary_large_image は画像が 300x157 以上・5MB 以下であることが条件。
    -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="START法トリアージ・トレーナー | START Triage Trainer" />
    <meta
      name="twitter:description"
      content="災害現場の一次トリアージ（START法）を反復練習する。10問チャレンジで全問正解を狙おう。"
    />
    <meta name="twitter:image" content="https://start.keiku-labo.space/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="START法トリアージ・トレーナー。赤I・黄II・緑III・黒0のトリアージ区分と傷病者のイラスト。"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
