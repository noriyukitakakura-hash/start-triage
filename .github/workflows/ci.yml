name: CI

# docs/INFRA.md §2: テストの gate は Actions、配信は Cloudflare Pages が担う。
# main へのマージ条件として下記ジョブを必須チェックに設定する。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
