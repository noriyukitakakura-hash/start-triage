<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0f172a"/>
  <!-- 単色の面で構成する。グラデーションは PNG の圧縮を著しく妨げる -->
  <rect x="0" y="400" width="1200" height="230" fill="#111c33"/>

  <!-- トリアージ色の帯。色だけに依存せずローマ数字も入れる -->
  <g>
    <rect x="0" y="0" width="1200" height="10" fill="#dc2626"/>
    <rect x="0" y="10" width="1200" height="10" fill="#fbbf24"/>
    <rect x="0" y="20" width="1200" height="10" fill="#16a34a"/>
    <rect x="0" y="30" width="1200" height="10" fill="#0f172a"/>
  </g>

  <text x="80" y="170" font-family="Hiragino Sans, sans-serif" font-size="62" font-weight="700" fill="#e2e8f0">START法トリアージ・トレーナー</text>
  <text x="80" y="236" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="600" fill="#94a3b8">START Triage Trainer</text>

  <text x="80" y="326" font-family="Hiragino Sans, sans-serif" font-size="30" fill="#cbd5e1">災害現場の一次トリアージを反復練習する</text>
  <text x="80" y="372" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#94a3b8">Drill primary triage for mass casualty incidents</text>

  <!-- 区分チップ -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">
    <rect x="80"  y="430" width="120" height="92" fill="#dc2626"/>
    <text x="140" y="478" fill="#ffffff">I</text>
    <text x="140" y="508" font-size="18" fill="#fecaca">緊急</text>

    <rect x="216" y="430" width="120" height="92" fill="#fbbf24"/>
    <text x="276" y="478" fill="#0f172a">II</text>
    <text x="276" y="508" font-size="18" fill="#78350f">非緊急</text>

    <rect x="352" y="430" width="120" height="92" fill="#16a34a"/>
    <text x="412" y="478" fill="#ffffff">III</text>
    <text x="412" y="508" font-size="18" fill="#bbf7d0">軽処置</text>

    <rect x="488" y="430" width="120" height="92" fill="#020617" stroke="#64748b" stroke-width="3"/>
    <text x="548" y="478" fill="#ffffff">0</text>
    <text x="548" y="508" font-size="18" fill="#94a3b8">死亡</text>
  </g>

  <!-- 傷病者イラスト（アプリと同じ描き方） -->
  <g transform="translate(760,300) scale(1.9)" >
    <circle cx="100" cy="30" r="14" fill="#e2e8f0"/>
    <rect x="94" y="42" width="11" height="14" rx="5" fill="#e2e8f0"/>
    <rect x="85" y="56" width="30" height="44" rx="13" fill="#e2e8f0" opacity="0.88"/>
    <g fill="none" stroke="#e2e8f0" stroke-linecap="round" stroke-linejoin="round">
      <path d="M100 100 L86 142 L78 184" stroke-width="11"/>
      <path d="M100 100 L116 140 L126 184" stroke-width="11"/>
      <path d="M83 64 L68 88 L72 110" stroke-width="9"/>
      <path d="M117 64 L132 86 L128 108" stroke-width="9"/>
      <path d="M14 186 L186 186" stroke-width="4" opacity="0.25"/>
    </g>
  </g>

  <text x="80" y="586" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#64748b">教育・訓練目的のシミュレーション / For training use only</text>
</svg>
